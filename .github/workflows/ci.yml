# Proves a fresh clone installs and builds, exactly as the README describes.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=moderate

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Check build output
        shell: pwsh
        run: |
          foreach ($f in 'out/main/index.js', 'out/preload/overlay.js', 'out/renderer/overlay.html', 'out/THIRD_PARTY_NOTICES.txt') {
            if (-not (Test-Path $f)) { throw "Missing $f" }
          }

      # Electron fetches its binary on first use (what `npm start` does for a
      # new clone), checked against the checksums shipped in its package.
      - name: Download Electron the way npm start does
        run: node -e "console.log(require('electron'))"
